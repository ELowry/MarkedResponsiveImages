name: Release to NPM

on:
    push:
        tags:
            - 'v*'

jobs:
    publish:
        runs-on: ubuntu-latest
        environment: NPM
        permissions:
            contents: read
            id-token: write

        steps:
            - name: Checkout Code
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '24'
                  registry-url: 'https://registry.npmjs.org'

            - name: Verify Version Integrity
              run: |
                  TAG_VERSION=${GITHUB_REF#refs/tags/v}

                  PKG_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('./package.json')).version")

                  echo "Git Tag Version: $TAG_VERSION"
                  echo "Package.json Version: $PKG_VERSION"

                  if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
                    echo "::error::Version mismatch! Git tag ($TAG_VERSION) does not match package.json ($PKG_VERSION)."
                    exit 1
                  fi
                  echo "Versions match. Proceeding with release."

            - name: Install Dependencies
              run: npm ci

            - name: Check Code Style (Prettier)
              run: npm run check-format

            - name: Lint Code
              run: npm run lint

            - name: Build and Minify
              run: npm run build

            - name: Run Tests
              run: npm test

            - name: Publish to NPM
              run: npm publish --access public --provenance

            - name: Upload Build Artifacts
              uses: actions/upload-artifact@v7
              with:
                  name: build-assets
                  path: dist/

    github-release:
        needs: publish
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Download Build Artifacts
              uses: actions/download-artifact@v8
              with:
                  name: build-assets
                  path: dist

            - name: Prepare Draft Assets for Release
              run: |
                  mkdir -p release-assets
                  cp dist/index.umd.js release-assets/marked-responsive-images.umd.js
                  cp dist/index.umd.js.map release-assets/marked-responsive-images.umd.js.map
                  cp dist/index.mjs release-assets/marked-responsive-images.mjs
                  cp dist/index.mjs.map release-assets/marked-responsive-images.mjs.map
                  cp dist/index.cjs release-assets/marked-responsive-images.cjs
                  cp dist/index.cjs.map release-assets/marked-responsive-images.cjs.map
                  cp dist/index.d.ts release-assets/index.d.ts

            - name: Generate Release Notes
              run: |
                  # Find the second most recent tag (the previous release)
                  PREV_TAG=$(git tag --sort=-creatordate | sed -n '2p')

                  # If a previous tag exists, log commits between then and now
                  if [ -n "$PREV_TAG" ]; then
                    git log ${PREV_TAG}..${{ github.ref_name }} --pretty=format:"- %s" > generated_notes.txt
                  else
                    # Fallback for the very first release
                    git log -5 --pretty=format:"- %s" > generated_notes.txt
                  fi

                  # Append the comparison link at the bottom
                  echo "" >> generated_notes.txt
                  echo "**Full Changelog:** https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${{ github.ref_name }}" >> generated_notes.txt

            - name: Create GitHub Release
              id: create_release
              uses: softprops/action-gh-release@v3
              with:
                  files: release-assets/*
                  draft: true
                  body_path: generated_notes.txt
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Notify Discord
              uses: ELowry/discord-draft-notifier@v1
              with:
                  webhook_url: ${{ secrets.DISCORD_WEBHOOK }}
                  version: ${{ github.ref_name }}
                  release_url: ${{ steps.create_release.outputs.url }}
                  notes_file_path: generated_notes.txt
